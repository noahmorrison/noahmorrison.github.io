<!DOCTYPE html>
<html lang="en">
  <head>
    {% capture page_title %}{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}{% endcapture %}
    {% assign page_description = page.description | default: site.description | strip %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }}</title>
    <meta name="description" content="{{ page_description }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{{ page_title }}">
    <meta property="og:description" content="{{ page_description }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/og-image.jpg' | absolute_url }}">
    <meta property="og:image:width" content="2048">
    <meta property="og:image:height" content="1367">
    <meta property="og:image:alt" content="A photo from Noah Morrison's Blue Birds and Turtles gallery">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
    <link href="/css/main.css" rel="stylesheet">
  </head>
  <body>
    {% include header.html %}

    <div class="content">
        {{ content }}
    </div>
  </body>
</html>
